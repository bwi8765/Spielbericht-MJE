<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spielverwaltung</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a24;
    --surface2: #1e2433;
    --border: #2a3048;
    --accent1: #e8ff47;
    --accent2: #ff4757;
    --text: #f0f2ff;
    --text-muted: #6b7491;
    --team1: #3d7fff;
    --team2: #ff6b35;
    --green: #3dffb0;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 16px;
    font-size: 14px;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .app-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--accent1);
  }

  /* SCOREBOARD */
  .scoreboard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .score-main {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .team-score-block { text-align: center; }
  .team-name-edit {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: inherit;
    text-align: center;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    cursor: pointer;
  }
  .team-name-edit:focus { border-bottom-color: var(--accent1); }
  .team1-color { color: var(--team1); }
  .team2-color { color: var(--team2); }
  .score-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1;
  }
  .score-sep { color: var(--text-muted); margin: 0 4px; }
  .score-half {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 8px;
  }
  .half-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .half-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    text-align: center;
  }
  .half-block { text-align: center; }

  /* SPECIAL SCORE */
  .special-score {
    background: var(--surface2);
    border-radius: 8px;
    padding: 10px 16px;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .special-score .label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .special-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--accent1);
  }
  .special-formula {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* CLOCK */
  .clock-section {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .clock-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 3px;
    color: var(--accent1);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 20px;
    min-width: 140px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .clock-display:hover { background: var(--border); }
  .clock-edit {
    display: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 3px;
    color: var(--accent1);
    background: var(--surface2);
    border: 1px solid var(--accent1);
    border-radius: 8px;
    padding: 4px 20px;
    width: 160px;
    text-align: center;
    outline: none;
  }
  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-start { background: var(--accent1); color: #000; }
  .btn-stop { background: var(--accent2); color: #fff; }
  .btn-reset { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .half-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    transition: all 0.2s;
  }
  .half-btn.active {
    background: var(--accent1);
    color: #000;
    border-color: var(--accent1);
  }

  /* TEAMS GRID */
  .teams-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 700px) { .teams-grid { grid-template-columns: 1fr; } }

  /* TEAM CARD */
  .team-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .team-card-header {
    padding: 10px 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .team1-header { background: rgba(61,127,255,0.15); border-bottom: 2px solid var(--team1); color: var(--team1); }
  .team2-header { background: rgba(255,107,53,0.15); border-bottom: 2px solid var(--team2); color: var(--team2); }

  /* PLAYER TABLE */
  .player-table { width: 100%; border-collapse: collapse; }
  .player-table th {
    padding: 6px 8px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    text-align: left;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .player-table th.center { text-align: center; }
  .player-table td {
    padding: 4px 6px;
    border-bottom: 1px solid rgba(42,48,72,0.5);
    vertical-align: middle;
  }
  .player-table tr:hover td { background: rgba(255,255,255,0.02); }
  .player-table tr:last-child td { border-bottom: none; }

  .cell-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    width: 100%;
    outline: none;
    padding: 2px 4px;
    transition: border-color 0.2s;
  }
  .cell-input:focus { border-bottom-color: var(--accent1); background: rgba(232,255,71,0.04); }
  .cell-input.num {
    width: 36px;
    text-align: center;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 12px;
  }
  .cell-input.goals {
    width: 36px;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--text);
  }
  .cell-input.goals:focus { color: var(--accent1); }

  .row-total {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    text-align: center;
    color: var(--green);
    min-width: 28px;
    display: block;
  }

  /* TOTALS ROW */
  .totals-row td {
    background: var(--surface2) !important;
    border-top: 2px solid var(--border) !important;
    font-weight: 600;
    font-size: 12px;
    color: var(--text-muted);
    padding: 6px 8px;
  }
  .totals-row .total-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    text-align: center;
    display: block;
  }
  .t1-val { color: var(--team1); }
  .t2-val { color: var(--team2); }
</style>
</head>
<body>

<div class="header">
  <div class="app-title">⚽ Spielbericht</div>
  <div class="clock-section">
    <button class="half-btn" id="halfBtn1" onclick="setHalf(1)">1. HZ</button>
    <button class="half-btn" id="halfBtn2" onclick="setHalf(2)">2. HZ</button>
    <div class="clock-display" id="clockDisplay" onclick="editClock()">00:00</div>
    <input class="clock-edit" id="clockEdit" type="text" placeholder="MM:SS" onblur="saveClock()" onkeydown="if(event.key==='Enter')saveClock()">
    <button class="btn btn-start" onclick="startClock()">▶ Start</button>
    <button class="btn btn-stop" onclick="stopClock()">■ Stop</button>
    <button class="btn btn-reset" onclick="resetClock()">↺</button>
  </div>
</div>

<!-- SCOREBOARD -->
<div class="scoreboard">
  <div class="score-main">
    <div class="team-score-block">
      <input class="team-name-edit team1-color" id="team1Name" type="text" value="Team A" oninput="updateAll()">
    </div>
    <div>
      <div class="score-display">
        <span id="totalScore1" class="team1-color">0</span>
        <span class="score-sep">:</span>
        <span id="totalScore2" class="team2-color">0</span>
      </div>
      <div class="score-half">
        <div class="half-block">
          <div class="half-label">1. Halbzeit</div>
          <div class="half-score"><span id="half1Score1" class="team1-color">0</span> : <span id="half1Score2" class="team2-color">0</span></div>
        </div>
        <div class="half-block">
          <div class="half-label">2. Halbzeit</div>
          <div class="half-score"><span id="half2Score1" class="team1-color">0</span> : <span id="half2Score2" class="team2-color">0</span></div>
        </div>
      </div>
    </div>
    <div class="team-score-block">
      <input class="team-name-edit team2-color" id="team2Name" type="text" value="Team B" oninput="updateAll()">
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    <div class="special-score">
      <div>
        <div class="label" id="specialLabel1">Team A – Sonderwertung</div>
        <div class="special-formula">Torschützen × Tore gesamt</div>
      </div>
      <div class="special-value" id="specialVal1">0</div>
    </div>
    <div class="special-score">
      <div>
        <div class="label" id="specialLabel2">Team B – Sonderwertung</div>
        <div class="special-formula">Torschützen × Tore gesamt</div>
      </div>
      <div class="special-value" id="specialVal2">0</div>
    </div>
  </div>
</div>

<!-- TEAMS -->
<div class="teams-grid">
  <!-- TEAM 1 -->
  <div class="team-card">
    <div class="team-card-header team1-header">
      🔵 <span id="t1HeaderName">Team A</span>
    </div>
    <table class="player-table" id="table1"></table>
  </div>
  <!-- TEAM 2 -->
  <div class="team-card">
    <div class="team-card-header team2-header">
      🟠 <span id="t2HeaderName">Team B</span>
    </div>
    <table class="player-table" id="table2"></table>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const PLAYERS = 16;
let teams = [
  { name: 'Team A', players: Array.from({length:PLAYERS},(_,i)=>({num:'',name:'',h1:0,h2:0})) },
  { name: 'Team B', players: Array.from({length:PLAYERS},(_,i)=>({num:'',name:'',h1:0,h2:0})) }
];

// ── Clock ──────────────────────────────────────────────────────────────────
let seconds = 0, clockInterval = null, currentHalf = 1;

function pad(n){return String(n).padStart(2,'0');}
function clockStr(s){ return pad(Math.floor(s/60))+':'+pad(s%60); }
function renderClock(){ document.getElementById('clockDisplay').textContent = clockStr(seconds); }

function startClock(){
  if(clockInterval) return;
  clockInterval = setInterval(()=>{ seconds++; renderClock(); }, 1000);
}
function stopClock(){
  clearInterval(clockInterval); clockInterval = null;
}
function resetClock(){
  stopClock(); seconds = 0; renderClock();
}
function editClock(){
  stopClock();
  let d = document.getElementById('clockDisplay');
  let e = document.getElementById('clockEdit');
  d.style.display='none'; e.style.display='block';
  e.value = clockStr(seconds); e.focus(); e.select();
}
function saveClock(){
  let e = document.getElementById('clockEdit');
  let parts = e.value.split(':');
  if(parts.length===2){
    let m=parseInt(parts[0])||0, s=parseInt(parts[1])||0;
    seconds = m*60+s;
  }
  document.getElementById('clockDisplay').style.display='';
  e.style.display='none';
  renderClock();
}
function setHalf(h){
  currentHalf = h;
  document.getElementById('halfBtn1').classList.toggle('active', h===1);
  document.getElementById('halfBtn2').classList.toggle('active', h===2);
}

// ── Build Tables ────────────────────────────────────────────────────────────
function buildTable(ti) {
  const table = document.getElementById('table'+('12'[ti]));
  table.innerHTML = `
    <thead><tr>
      <th style="width:36px" class="center">#</th>
      <th>Name</th>
      <th class="center" style="width:38px">1.HZ</th>
      <th class="center" style="width:38px">2.HZ</th>
      <th class="center" style="width:38px">Ges.</th>
    </tr></thead><tbody id="tbody${ti}"></tbody>
    <tfoot><tr class="totals-row">
      <td colspan="2" style="font-size:11px;letter-spacing:.5px;">GESAMT</td>
      <td><span class="total-val ${ti===0?'t1-val':'t2-val'}" id="tot${ti}_h1">0</span></td>
      <td><span class="total-val ${ti===0?'t1-val':'t2-val'}" id="tot${ti}_h2">0</span></td>
      <td><span class="total-val ${ti===0?'t1-val':'t2-val'}" id="tot${ti}_total">0</span></td>
    </tr></tfoot>
  `;
  const tbody = document.getElementById('tbody'+ti);
  teams[ti].players.forEach((p, pi) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input class="cell-input num" type="text" value="${p.num}" placeholder="##"
        oninput="teams[${ti}].players[${pi}].num=this.value;updateAll()"></td>
      <td><input class="cell-input" type="text" value="${p.name}" placeholder="Vorname"
        oninput="teams[${ti}].players[${pi}].name=this.value;updateAll()"></td>
      <td><input class="cell-input goals" type="number" min="0" value="${p.h1||''}" placeholder="0"
        oninput="teams[${ti}].players[${pi}].h1=parseInt(this.value)||0;updateAll()"></td>
      <td><input class="cell-input goals" type="number" min="0" value="${p.h2||''}" placeholder="0"
        oninput="teams[${ti}].players[${pi}].h2=parseInt(this.value)||0;updateAll()"></td>
      <td><span class="row-total" id="rowTotal_${ti}_${pi}">0</span></td>
    `;
    tbody.appendChild(tr);
  });
}

// ── Update All ───────────────────────────────────────────────────────────────
function updateAll(){
  // Sync names
  teams[0].name = document.getElementById('team1Name').value;
  teams[1].name = document.getElementById('team2Name').value;
  document.getElementById('t1HeaderName').textContent = teams[0].name;
  document.getElementById('t2HeaderName').textContent = teams[1].name;
  document.getElementById('specialLabel1').textContent = teams[0].name + ' – Sonderwertung';
  document.getElementById('specialLabel2').textContent = teams[1].name + ' – Sonderwertung';

  let scores = [0,0,0,0]; // h1t0, h1t1, h2t0, h2t1
  for(let ti=0;ti<2;ti++){
    let h1=0,h2=0,scorers=0;
    teams[ti].players.forEach((p,pi)=>{
      const total = p.h1 + p.h2;
      const el = document.getElementById(`rowTotal_${ti}_${pi}`);
      if(el) el.textContent = total;
      h1 += p.h1; h2 += p.h2;
      if(total > 0) scorers++;
    });
    // totals footer
    document.getElementById(`tot${ti}_h1`).textContent = h1;
    document.getElementById(`tot${ti}_h2`).textContent = h2;
    document.getElementById(`tot${ti}_total`).textContent = h1+h2;
    // special
    document.getElementById(`specialVal${ti+1}`).textContent = scorers * (h1+h2);
    // scores array
    if(ti===0){ scores[0]=h1; scores[2]=h2; }
    else { scores[1]=h1; scores[3]=h2; }
  }
  document.getElementById('half1Score1').textContent = scores[0];
  document.getElementById('half1Score2').textContent = scores[1];
  document.getElementById('half2Score1').textContent = scores[2];
  document.getElementById('half2Score2').textContent = scores[3];
  document.getElementById('totalScore1').textContent = scores[0]+scores[2];
  document.getElementById('totalScore2').textContent = scores[1]+scores[3];
}

// ── Init ────────────────────────────────────────────────────────────────────
buildTable(0);
buildTable(1);
setHalf(1);
renderClock();
updateAll();
</script>
</body>
</html>
